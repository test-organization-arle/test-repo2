name: GitHub Actions for pull requests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'develop'    
      - 'common'
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    name: SonarCloud
    steps:
      - name: List S3 buckets
        run: |
          echo $AWS_ACCESS_KEY_ID
          echo $AWS_SECRET_ACCESS_KEY
          aws s3 ls
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEV_PIPELINE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEV_PIPELINE_SECRET_KEY }}
          AWS_DEFAULT_REGION: 'ap-east-1'    
      - name: Run Sonarqube
        run: |
          echo "Sonarqube is running"
          echo "GITHUB_REF_TYPE=$GITHUB_REF_TYPE"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_BASE_REF=$GITHUB_BASE_REF"
          echo "GITHUB_HEAD_REF=$GITHUB_HEAD_REF"
          touch aws-credentials.txt
          cat aws-credentials.txt | wc -c    
          echo "aws-access-key: $AWS_DEV_PIPELINE_ACCESS_KEY" > aws-credentials.txt
          echo "aws-secret-key: $AWS_DEV_PIPELINE_SECRET_KEY" >> aws-credentials.txt
          echo "cat aws-credentials.txt | wc -c"
          cat aws-credentials.txt | wc -c                
  deploy:
    uses: ./.github/workflows/github-actions-template.yml
    #secrets: inherit
    secrets:
      AWS_DEV_PIPELINE_ACCESS_KEY: ${{ secrets.AWS_DEV_PIPELINE_ACCESS_KEY }}