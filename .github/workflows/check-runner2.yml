name: Check Runner Availability

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  check_runners:
    runs-on: ubuntu-latest
    outputs:
      org_runner_available: ${{ steps.check-org-runners.outputs.available }}
      repo_runner_available: ${{ steps.check-repo-runners.outputs.available }}
    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}        
      - name: Check organization runners
        id: check-org-runners
        env:
          PAT: ${{ steps.generate_token.outputs.token }}
        run: |
          # For organization runners (replace ORG_NAME with your org name)
          ORG_RESPONSE=$(curl -s -H "Authorization: token $PAT" \
            "https://api.github.com/orgs/ORG_NAME/actions/runners")
          
          ORG_ONLINE=$(echo "$ORG_RESPONSE" | jq -r '.runners[] | select(.status=="online") | select(.labels[].name=="self-hosted") | .id' | wc -l)
          
          if [ "$ORG_ONLINE" -gt 0 ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Check repository runners
        id: check-repo-runners
        env:
          PAT: ${{ steps.generate_token.outputs.token }}        
        run: |
          # For repository-level runners
          REPO_RESPONSE=$(curl -s -H "Authorization: token $PAT" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners")
          
          REPO_ONLINE=$(echo "$REPO_RESPONSE" | jq -r '.runners[] | select(.status=="online") | select(.labels[].name=="self-hosted") | .id' | wc -l)
          
          if [ "$REPO_ONLINE" -gt 0 ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

  use_runner:
    needs: check_runners
    if: needs.check_runners.outputs.org_runner_available == 'true' || needs.check_runners.outputs.repo_runner_available == 'true'
    runs-on: self-hosted
    steps:
      - run: echo "Running on self-hosted runner"

  fallback:
    needs: check_runners
    if: needs.check_runners.outputs.org_runner_available == 'false' && needs.check_runners.outputs.repo_runner_available == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Falling back to GitHub-hosted runner"