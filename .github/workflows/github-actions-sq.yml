name: GitHub Actions for sonarqube on pull requests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'develop'    
      - 'common'
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: self-hosted
    #container: python:alpine3.8
    container: python:3.8.15-slim-buster
    strategy:
      matrix:
        python-version: [ "3.8",]
    steps:
      # - name: cleanup #https://github.com/actions/checkout/issues/211
      #   run: |
      #     sudo chown -R $USER:$USER $GITHUB_WORKSPACE -R
      - run: echo "run 1"   
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python }}

      - name: Install pip dependencies
        run: |
          mkdir -p /github/home/.cache/pip
          chown -R root:root /github/home/.cache/pip
          echo "python --version"
          python --version
          python -m venv sonarqube
          . sonarqube/bin/activate
          echo "python --version"
          python --version
          mkdir $GITHUB_WORKSPACE/.cache       
          python -m pip install --upgrade pip          
          python -m pip install -r requirements_test.txt
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

