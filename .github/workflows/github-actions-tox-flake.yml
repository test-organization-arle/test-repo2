name: GitHub Actions for tox and flake8 on pull requests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'develop'    
      - 'common'
jobs:
  flake8-tox:
    name: Flake8-Tox
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: [ "3.8",]
    steps:
      - run: echo "run 1"   
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python }}

      - name: Install tox and any other dependencies
        run: | 
          python -m pip install --upgrade pip
          python -m pip install tox-docker --user
          python -m pip install tox --user
          python -m pip install -r requirements_test.txt --user
          
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run tox
        run: python -m tox -e py