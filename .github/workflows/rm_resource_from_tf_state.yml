name: "Remove resource from Terraform State File. Forget about the resource"

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Report all of the resource instances that match the given address without actually "forgetting" any of them'
        type: choice
        options:
        - true
        - false
        default: 'true'    
      resourceAddress:
        type: string
        description: 'Terraform resource address'
        required: true
        default: ''

jobs:
  terraform_state_rm:
    name: "terraform state removal"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.1.4
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Apply Refresh
        id: ApplyRefresh
        run: terraform -chdir=dev state rm 'module.ec2.aws_network_interface_sg_attachment.sg_attachment1["instance5"]'
        if: ${{ github.event.inputs.dryRun == 'false' }}