name: Test

on:
  workflow_dispatch:

env:
  cache-name: ecs-definition-files

jobs:
  test1:   
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3      
      - name: Show checkout files
        run: |
          ls -lha

      - name: Cache ecs definition files
        uses: actions/cache/save@v3
        with:
          path: ./files/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}

  test2:   
    runs-on: ubuntu-latest
    needs: [test1]
    steps:
      - name: Restore ecs definition files cache
        uses: actions/cache/restore@v3
        with:
          path: ./files/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}
      - name: Show cached files
        run: |
          ls -lha
          cat files/file1.txt
      - uses: snnaplab/delete-branch-cache-action@v1
        with:
          ref: ${{ github.ref }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}