name: Deploy

on:
  push:
    branches:
      - develop
      - production
  pull_request:
    branches:
      - develop

jobs:
  map-envs:
    runs-on: ubuntu-latest
    steps:
    - id: map
      env:
        REF_TYPE: ${{ github.ref_type }}
      run: |
        if [ $REF_TYPE == "branch" ]
        then      
            case "${{github.ref_name}}" in
            develop)
                echo "stage=qa" >> $GITHUB_OUTPUT
                ;;
            production)
                echo "stage=prod" >> $GITHUB_OUTPUT
                ;;
            esac
        fi
    outputs:
      stage: ${{ steps.map.outputs.stage }}

  deploy:
    name: Deploy in ${{ needs.map-envs.outputs.stage }} stage
    needs: map-envs
    runs-on: ubuntu-latest

    steps:        
      - run: |
          echo "Deploying in ${{ needs.map-envs.outputs.stage }} stage"
          echo "github.ref_type: $REF_TYPE"
        env:
          REF_TYPE: ${{ github.ref_type }}