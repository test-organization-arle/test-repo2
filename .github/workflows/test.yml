name: Test

on:
  workflow_dispatch:

jobs:
  test:   
    runs-on: ubuntu-latest
    steps:
      - name: Test if clause
        run: |
          if [ $GITHUB_REF_NAME == "develop" ]
          then
            echo "The branch name is develop"
          else
            echo "The branch name is $GITHUB_REF_NAME"
          fi