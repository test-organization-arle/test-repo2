    <script type="text/javascript">
      let reg = /^.*(\/channels\/).*/g;

      (function () {
        window.addEventListener('popstate', (event) => {
          const url = location.pathname;
          const prevUrl = sessionStorage.getItem('prevUrl');
          if (url.match(reg)) {
            const loc = `${location.origin}${prevUrl}`;
            window.location.href = loc;
          }
        });
      })();
